<!-- Hairline Progress Line Bar -->

<script>
    (function () {
      const slides = Array.from(document.querySelectorAll('.slide'));
      const counter = document.getElementById('frame-counter');
      const title = document.getElementById('slide-title');
      const sub = document.getElementById('slide-sub');
      const progressBar = document.getElementById('progress-bar');
      const playPauseBtn = document.getElementById('play-pause-btn');
      const playPauseIcon = document.getElementById('play-pause-icon');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const prevZone = document.getElementById('prev-zone');
      const nextZone = document.getElementById('next-zone');
      const fullscreenBtn = document.getElementById('fullscreen-btn');

      let current = 0;
      let isPlaying = true;
      let intervalTimer = null;
      const slideDuration = 6000;

      function renderSlide(index) {
        slides.forEach((slide, i) => {
          const bgImg = slide.firstElementChild;
          if (i === index) {
            slide.classList.remove('opacity-0', 'pointer-events-none', 'z-0');
            slide.classList.add('opacity-100', 'z-10');
            if (bgImg) {
              bgImg.classList.remove('scale-105');
              bgImg.classList.add('scale-100');
            }
          } else {
            slide.classList.remove('opacity-100', 'z-10');
            slide.classList.add('opacity-0', 'pointer-events-none', 'z-0');
            if (bgImg) {
              bgImg.classList.remove('scale-100');
              bgImg.classList.add('scale-105');
            }
          }
        });

        const activeSlide = slides[index];
        const slideTitle = activeSlide.getAttribute('data-title');
        const slideSub = activeSlide.getAttribute('data-sub');

        if (title) {
          title.style.opacity = '0';
          setTimeout(() => {
            title.innerHTML = slideTitle;
            title.style.opacity = '1';
          }, 200);
        }

        if (sub) {
          sub.innerHTML = slideSub;
        }

        if (counter) {
          counter.textContent = '0' + (index + 1) + ' / 0' + slides.length;
        }

        if (progressBar) {
          const percentage = ((index + 1) / slides.length) * 100;
          progressBar.style.width = percentage + '%';
        }
      }

      function nextSlide() {
        current = (current + 1) % slides.length;
        renderSlide(current);
      }

      function prevSlide() {
        current = (current - 1 + slides.length) % slides.length;
        renderSlide(current);
      }

      function startAutoplay() {
        clearInterval(intervalTimer);
        intervalTimer = setInterval(nextSlide, slideDuration);
        isPlaying = true;
        if (playPauseIcon) playPauseIcon.textContent = 'pause';
      }

      function pauseAutoplay() {
        clearInterval(intervalTimer);
        isPlaying = false;
        if (playPauseIcon) playPauseIcon.textContent = 'play_arrow';
      }

      function toggleAutoplay() {
        if (isPlaying) {
          pauseAutoplay();
        } else {
          startAutoplay();
        }
      }

      nextBtn && nextBtn.addEventListener('click', () => { nextSlide(); if(isPlaying) startAutoplay(); });
      prevBtn && prevBtn.addEventListener('click', () => { prevSlide(); if(isPlaying) startAutoplay(); });
      nextZone && nextZone.addEventListener('click', () => { nextSlide(); if(isPlaying) startAutoplay(); });
      prevZone && prevZone.addEventListener('click', () => { prevSlide(); if(isPlaying) startAutoplay(); });
      playPauseBtn && playPauseBtn.addEventListener('click', toggleAutoplay);

      fullscreenBtn && fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
          nextSlide();
          if (isPlaying) startAutoplay();
        } else if (e.key === 'ArrowLeft') {
          prevSlide();
          if (isPlaying) startAutoplay();
        }
      });

      startAutoplay();
    })();
  </script>
